# @everywhere-harness/plugin-providers
# Installs the Antigravity OAuth/proxy Host plugin.
# The route is added to the base llm-pi-ai instance by the profile overlay;
# this bundle must not mount a second llm-pi-ai adapter because each instance
# publishes the installed pi-ai catalog and collides on providers such as
# amazon-bedrock.
- insert:
    - id: providers-antigravity
      name: '@everywhere-harness/plugin-providers'
      config: {}
